":":hover・:focus・:active","formal_name":"Pseudo Class","formal_name_ja":"疑似クラス","category":"CSS","aliases":[":hover",":focus",":active",":visited",":first-child",":last-child",":nth-child",":not",":checked"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/Pseudo-classes","summary":"要素の状態（ホバー・フォーカスなど）に応じてスタイルを適用する。","usage":"マウスを乗せたとき・クリックしたとき・フォーカスしたときにスタイルを変えたいとき。","examples":[{"code":".btn:hover  { background: darkblue; }\n.btn:active { transform: scale(0.98); }\ninput:focus { border-color: blue; }","note":""}],"similar":[{"id":"pseudo-element","diff":"疑似要素（::before等）はコンテンツを追加する"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"pseudo-element","word":"::before・::after","formal_name":"Pseudo Element","formal_name_ja":"疑似要素","category":"CSS","aliases":["::before","::after","::placeholder","::selection"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/Pseudo-elements","summary":"要素の前後に仮想のコンテンツを追加する。contentプロパティと一緒に使う。","usage":"要素の前後に装飾を追加したいとき（アイコン・区切り線など）。","examples":[{"code":".required::after {\n  content: ' *';\n  color: red;\n}\n\n.divider::before {\n  content: '';\n  display: block;\n  border-top: 1px solid #ccc;\n}","note":"content: ''は必須（空でも書く）"}],"similar":[{"id":"content","diff":"contentプロパティで疑似要素の内容を指定する"}],"mistakes":["content プロパティを書き忘れると疑似要素が表示されない"],"browser_support":"全ブラウザ対応"},{"id":"calc","word":"calc()","formal_name":"Calc Function","formal_name_ja":"計算関数","category":"CSS","aliases":["calc"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/calc","summary":"CSSの値を計算式で指定する。異なる単位同士の計算もできる。","usage":"100%から固定値を引いた幅など、計算が必要なサイズを指定したいとき。","examples":[{"code":".sidebar { width: 240px; }\n.main    { width: calc(100% - 240px); } // 残り幅\n\n.centered { margin-top: calc(50vh - 100px); }","note":""}],"similar":[],"mistakes":["演算子の前後にスペースが必要（calc(100%-240px)はNG）"],"browser_support":"全ブラウザ対応"},{"id":"clamp","word":"clamp()","formal_name":"Clamp Function","formal_name_ja":"範囲制限関数","category":"CSS","aliases":["clamp","min()","max()"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/clamp","summary":"最小値・推奨値・最大値の範囲内で値を自動調整する。レスポンシブなフォントサイズに便利。","usage":"画面幅に応じてフォントサイズを滑らかに変化させたいとき。","examples":[{"code":".title {\n  font-size: clamp(24px, 5vw, 48px);\n  // 最小24px・画面幅の5%・最大48px\n}","note":"メディアクエリなしでレスポンシブなサイズ指定ができる"}],"similar":[{"id":"media-query","diff":"@mediaは条件で切り替え・clampは連続的に変化"}],"mistakes":[],"browser_support":"全ブラウザ対応（Chrome 79以降）"},{"id":"variable-font","word":"font-variation-settings","formal_name":"Variable Font","formal_name_ja":"可変フォント設定","category":"CSS","aliases":["font-variation-settings","font-optical-sizing"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/font-variation-settings","summary":"可変フォントの軸（太さ・幅など）を細かく制御する。","usage":"可変フォントを使って太さや幅を細かく調整したいとき。","examples":[{"code":".text {\n  font-variation-settings: 'wght' 350, 'wdth' 75;\n}","note":"可変フォントが必要（Google Fontsなどで対応フォントを確認）"}],"similar":[{"id":"font-weight","diff":"font-weightは100刻みの指定・こちらは1刻みで細かく指定できる"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"scroll-snap","word":"scroll-snap-type","formal_name":"Scroll Snap","formal_name_ja":"スクロールスナップ","category":"CSS","aliases":["scroll-snap-type","scroll-snap-align"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/scroll-snap-type","summary":"スクロール時に特定の位置でピタッと止まる動作をCSSだけで実現する。","usage":"スライドショーやページごとのスクロールをJavaScriptなしで実装したいとき。","examples":[{"code":".container {\n  scroll-snap-type: y mandatory;\n  overflow-y: scroll;\n}\n.section {\n  scroll-snap-align: start;\n}","note":""}],"similar":[],"mistakes":["scroll-snap-typeを親に・scroll-snap-alignを子に指定する"],"browser_support":"全ブラウザ対応"},{"id":"isolation","word":"isolation","formal_name":"Isolation","formal_name_ja":"重なり順の独立","category":"CSS","aliases":["isolation"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/CSS/isolation","summary":"要素が新しいスタッキングコンテキストを作るかどうかを指定する。z-indexの影響範囲を制限できる。","usage":"z-indexが意図せず別の要素に影響しているときに影響範囲を分離したいとき。","examples":[{"code":".modal-container {\n  isolation: isolate; // このd  { return a + b; }\n\n// アロー関数\nconst add2 = (a, b) =\u003e a + b;\n\n// コールバックに使う\n[1,2,3].map(n =\u003e n * 2); // [2,4,6]","note":""}],"similar":[{"id":"function","diff":"functionは従来の関数宣言・アロー関数はより短く書ける"}],"mistakes":["アロー関数はthisの扱いが通常の関数と異なる"],"browser_support":"全ブラウザ対応"},{"id":"find","word":"find","formal_name":"Array.find","formal_name_ja":"配列から条件に合う要素を取得","category":"JavaScript","aliases":["find","findIndex"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/Array/find","summary":"配列から条件を満たす最初の要素を返すメソッド。見つからない場合はundefinedが返る。","usage":"配列から特定の条件の要素を1件だけ取得したいとき。","examples":[{"code":"const users = [{id:1,name:'田中'},{id:2,name:'鈴木'}];\nconst user = users.find(u =\u003e u.id === 1);\nconsole.log(user.name); // '田中'\n\n// インデックスを取得したい場合\nconst idx = users.findIndex(u =\u003e u.id === 1); // 0","note":""}],"similar":[{"id":"filter","diff":"filterは条件を満たすすべての要素を返す（複数）"}],"mistakes":["見つからない場合はundefinedが返る → nullチェックが必要"],"browser_support":"全ブラウザ対応","error_patterns":["Cannot read properties of undefined"]},{"id":"reduce","word":"reduce","formal_name":"Array.reduce","formal_name_ja":"配列の集計","category":"JavaScript","aliases":["reduce"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/Array/reduce","summary":"配列の全要素を順番に処理して1つの値にまとめるメソッド。合計・最大値・グループ化などに使う。","usage":"配列の合計値を計算したいとき・配列をオブジェクトに変換したいとき。","examples":[{"code":"const numbers = [1, 2, 3, 4, 5];\nconst sum = numbers.reduce((acc, n) =\u003e acc + n, 0);\nconsole.log(sum); // 15","note":"第2引数の0が初期値"}],"similar":[{"id":"map","diff":"mapは各要素を変換した配列を返す"},{"id":"filter","diff":"filterは条件を満たす要素の配列を返す"}],"mistakes":["初期値（第2引数）を忘れると空配列でエラーになる"],"browser_support":"全ブラウザ対応"},{"id":"includes","word":"includes","formal_name":"Array.includes / String.includes","formal_name_ja":"要素・文字列の存在確認","category":"JavaScript","aliases":["includes"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/Array/includes","summary": Objects/Array/slice","summary":"配列や文字列の一部を取り出して新しい配列・文字列を返す。元のデータは変更されない。","usage":"配列の最初の3件だけ取得したいとき・文字列の一部を切り出したいとき。","examples":[{"code":"const arr = [1, 2, 3, 4, 5];\nconsole.log(arr.slice(0, 3));  // [1, 2, 3]\nconsole.log(arr.slice(-2));    // [4, 5]\n\nconst str = 'Hello World';\nconsole.log(str.slice(0, 5)); // 'Hello'","note":"元のデータは変更されない"}],"similar":[{"id":"spread","diff":"スプレッドは配列のコピーや結合に使う"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"string-methods","word":"split・join","formal_name":"String.split / Array.join","formal_name_ja":"文字列と配列の変換","category":"JavaScript","aliases":["split","join"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/String/split","summary":"split: 文字列を区切り文字で分割して配列にする。join: 配列を区切り文字でつなげて文字列にする。","usage":"CSVデータを扱うとき・タグをカンマ区切りで表示したいとき。","examples":[{"code":"const csv = 'りんご,みかん,バナナ';\nconst arr = csv.split(',');    // ['りんご', 'みかん', 'バナナ']\nconst str = arr.join(' / ');  // 'りんご / みかん / バナナ'","note":""}],"similar":[],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"string-replace","word":"replace・replaceAll","formal_name":"String.replace / replaceAll","formal_name_ja":"文字列の置換","category":"JavaScript","aliases":["replace","replaceAll"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/String/replace","summary":"文字列の一部を別の文字列に置換するメソッド。","usage":"テキストの一部を別の文字に置き換えたいとき。","examples":[{"code":"const str = 'Hello World';\nconsole.log(str.replace('World', 'Japan'));    // 'Hello Japan'\nconsole.log(str.replaceAll('l', 'L'));         // 'HeLLo WorLd'","note":"replaceは最初の1件のみ・replaceAllは全件"}],"similar":[],"mistakes":["replaceは最初の1件だけ置換する（全件はreplaceAllを使う）"],"browser_support":"全ブラウザ対応"},{"id":"object-methods","word":"Object.keys・values・entries","formal_name":"Object.keys / values / entries","formal_name_ja":"オブジェクトの反復処理","category":"JavaScript","aliases":["Object.keys","Object.values","Object.entries"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/Object/keys","summary":"オブジェクトのキー・値・キーと値のペアを配列として取得するメソッド。","usage":"オブジェクトをループで処理したいとき。","examples":[{"code":"const user = { name: '田中', age: 25, city: '東京' };\nconsole.log(Object.keys(user));    // ['name', 'age', 'city']\nconsole.log(Object.values(user));  // ['田中', 25, '東京']\nconsole.log(Object.entries(user)); // [['name','田中'], ['age',25], ...]","note":""}],"similar":[{"id":"forEach","diff":"forEachは配列の繰り返し・Object.entriesと組み合わせるとオブジェクトも繰り返せる"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"destructuring","word":"分割代入","formal_name":"Destructuring Assignment","formal_name_ja":"分割代入","category":"JavaScript","aliases":["destructuring","{ }","[ ]"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment","summary":"配列やオブジェクトから値を取り出して変数に代入する簡潔な構文。","usage":"オブジェクトや配列から複数の値を一度に取り出したいとき。","examples":[{"code":"// オブジェクトの分割代入\nconst { name, age } = { name: '田中', age: 25 };\n\n// 配列の分割代入\nconst [first, second] = ['りんご', 'みかん'];\n\n// 関数の引数でよく使う\nfunction greet({ name, age }) { ... }","note":""}],"similar":[{"id":"spread","diff":"スプレッドは配列・オブジェクトの展開"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"optional-chaining","word":"?.（オプショナルチェーン）","formal_name":"Optional Chaining","formal_name_ja":"オプショナルチェーン","category":"JavaScript","aliases":["?.","optional chaining"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Operators/Optional_chaining","summary":"オブジェクトのプロパティにアクセスするとき、途中がnullやundefinedでもエラーにならない演算子。","usage":"ネストしたオブジェクトのプロパティに安全にアクセスしたいとき。","examples":[{"code":"const user = null;\n\n// 従来（エラーになる）\nconsole.log(user.name); // TypeError!\n\n// オプショナルチェーン（安全）\nconsole.log(user?.name); // undefined","note":""}],"similar":[],"mistakes":[],"browser_support":"全ブラウザ対応","error_patterns":["Cannot read properties of null","Cannot read properties of undefined"]},{"id":"nullish-coalescing","word":"??（Null合体演算子）","formal_name":"Nullish Coalescing Operator","formal_name_ja":"Null合体演算子","category":"JavaScript","aliases":["??","nullish coalescing"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Operators/Nullish_coalescing","summary":"左辺がnullまたはundefinedのときだけ右辺を返す演算子。0や空文字は通す点が||と異なる。","usage":"デフォルト値を設定したいとき。0や空文字も有効な値として扱いたいとき。","examples":[{"code":"const name = null;\nconsole.log(name ?? 'ゲスト'); // 'ゲスト'\n\nconst count = 0;\nconsole.log(count ?? 10); // 0（0はそのまま通る）\nconsole.log(count || 10); // 10（||は0をfalseと扱う）","note":"||との違いに注意"}],"similar":[],"mistakes":["||はfalsyな値（0・空文字・false）も右辺にするが、??はnull/undefinedのみ"],"browser_support":"全ブラウザ対応"},{"id":"promise","word":"Promise","formal_name":"Promise","formal_name_ja":"非同期処理の結果オブジェクト","category":"JavaScript","aliases":["Promise","then","catch"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/Promise","summary":"非同期処理の結果を表すオブジェクト。成功時はthen・失敗時はcatchで処理する。","usage":"fetchなどの非同期処理の結果を扱うとき。async/awaitの方が読みやすい場合が多い。","examples":[{"code":"fetch('https://api.example.com/data')\n  .then(res =\u003e res.json())\n  .then(data =\u003e console.log(data))\n  .catch(err =\u003e console.error(err));","note":"async/awaitの方が読みやすい場合が多い"}],"similar":[{"id":"async","diff":"async/awaitはPromiseをより読みやすく書ける構文"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"class","word":"class","formal_name":"Class","formal_name_ja":"クラス","category":"JavaScript","aliases":["class","constructor","extends","new"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Statements/class","summary":"オブジェクトの設計図となるクラスを定義する。newでインスタンスを生成する。","usage":"同じ構造のオブジェクトを大量に作りたいとき・コードをオブジェクト指向で整理したいとき。","examples":[{"code":"class User {\n  constructor(name, age) {\n    this.name = name;\n    this.age  = age;\n  }\n  greet() {\n    return `こんにちは、${this.name}さん`;\n  }\n}\nconst user = new User('田中', 25);\nconsole.log(user.greet());","note":""}],"similar":[{"id":"function","diff":"関数でも同じことができるが、classの方が構造が明確"}],"mistakes":["newを忘れるとundefinedが返る"],"browser_support":"全ブラウザ対応","error_patterns":["is not a constructor"]},{"id":"this","word":"this","formal_name":"this","formal_name_ja":"コンテキストオブジェクト","category":"JavaScript","aliases":["this"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Operators/this","summary":"関数が呼び出されたコンテキスト（文脈）を参照するキーワード。クラス内やイベントハンドラでよく使う。","usage":"クラスのメソッド内で自分のプロパティにアクセスするとき。","examples":[{"code":"class Counter {\n  constructor() {\n    this.count = 0; // 自分のcountプロパティ\n  }\n  increment() {\n    this.count++;\n  }\n}","note":"アロー関数ではthisの参照先が変わる"}],"similar":[],"mistakes":["アロー関数の中のthisは外側のthisを参照する（通常の関数と異なる）"],"browser_support":"全ブラウザ対応"},{"id":"switch","word":"switch","formal_name":"switch","formal_name_ja":"多分岐処理","category":"JavaScript","aliases":["switch","case","break","default"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Statements/switch","summary":"複数の条件で処理を分岐させる構文。if-else ifを複数書くより見やすい場合がある。","usage":"条件が3つ以上あるとき・特定の値に応じて処理を変えたいとき。","examples":[{"code":"const day = '月曜';\nswitch (day) {\n  case '月曜':\n    console.log('週の始まり');\n    break;\n  case '金曜':\n    console.log('週末直前');\n    break;\n  default:\n    console.log('平日');\n}","note":"breakを書き忘れると次のcaseも実行される"}],"similar":[{"id":"if","diff":"ifは複雑な条件に向く・switchは値が一致するかどうかで分岐"}],"mistakes":["breakを書き忘れると次のcaseも実行されてしまう（フォールスルー）"],"browser_support":"全ブラウザ対応"},{"id":"typeof","word":"typeof","formal_name":"typeof","formal_name_ja":"型の確認","category":"JavaScript","aliases":["typeof","instanceof"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Operators/typeof","summary":"値のデータ型を文字列で返す演算子。","usage":"変数の型を確認したいとき・undefinedかどうかチェックしたいとき。","examples":[{"code":"console.log(typeof 'hello');   // 'string'\nconsole.log(typeof 42);        // 'number'\nconsole.log(typeof true);      // 'boolean'\nconsole.log(typeof undefined); // 'undefined'\nconsole.log(typeof null);      // 'object'（注意：バグ的な仕様）\nconsole.log(typeof []);        // 'object'","note":"nullとArrayはobjectを返す点に注意"}],"similar":[],"mistakes":["typeof nullは'object'を返す（JavaScriptの歴史的なバグ）"],"browser_support":"全ブラウザ対応"},{"id":"array-from","word":"Array.from","formal_name":"Array.from","formal_name_ja":"配列に変換","category":"JavaScript","aliases":["Array.from","Array.of","Array.isArray"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/JavaScript/Reference/Global_Objects/Array/from","summary":"配列風のオブジェクト（NodeListなど）を本当の配列に変換するメソッド。","usage":"querySelectorAllで取得した要素リストを配列として操作したいとき。","examples":[{"code":"// NodeListを配列に変換\nconst nodes = document.querySelectorAll('.item');\nconst arr = Array.from(nodes);\narr.map(el =\u003e el.textContent);\n\n// 数値の配列を生成\nconst nums = Array.from({length: 5}, (_, i) =\u003e i + 1); // [1,2,3,4,5]","note":""}],"similar":[],"mistakes":["querySelectorAllの結果はNodeListでArrayではないためmapやfilterが使えない"],"browser_support":"全ブラウザ対応"},{"id":"event-object","word":"event（イベントオブジェクト）","formal_name":"Event Object","formal_name_ja":"イベントオブジェクト","category":"JavaScript","aliases":["event","e","evt","preventDefault","stopPropagation","target"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/API/Event","summary":"イベントが発生したときに自動的に渡されるオブジェクト。クリックされた要素や入力値を取得できる。","usage":"クリックされた要素を取得したいとき・フォームの送信をキャンセルしたいとき。","examples":[{"code":"btn.addEventListener('click', (e) =\u003e {\n  console.log(e.target);      // クリックされた要素\n  e.preventDefault();         // デフォルト動作をキャンセル\n  e.stopPropagation();        // イベントの伝播を止める\n});\n\ninput.addEventListener('input', (e) =\u003e {\n  console.log(e.target.value); // 入力値\n});","note":""}],"similar":[{"id":"addEventListener","diff":"addEventListenerでイベントを登録する・eventオブジェクトは自動で渡される"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"dom-create","word":"createElement・appendChild","formal_name":"createElement / appendChild","formal_name_ja":"要素の動的生成・追加","category":"JavaScript","aliases":["createElement","appendChild","append","prepend","remove","insertBefore"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/API/Document/createElement","summary":"HTMLの要素をJavaScriptで動的に生成してDOMに追加するメソッド。","usage":"ボタンをクリックしたときに新しいリスト項目を追加するなど、動的にHTMLを生成したいとき。","examples":[{"code":"const li = document.createElement('li');\nli.textContent = '新しい項目';\nli.classList.add('item');\n\nconst ul = document.getElementById('list');\nul.appendChild(li); // リストに追加","note":""}],"similar":[{"id":"innerHTML","diff":"innerHTMLでもHTML生成できるがXSSリスクがある"}],"mistakes":[],"browser_support":"全ブラウザ対応"},{"id":"style-property","word":"element.style","formal_name":"HTMLElement.style","formal_name_ja":"インラインスタイルの操作","category":"JavaScript","aliases":["style","element.style"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/API/HTMLElement/style","summary":"要素のインラインスタイルをJavaScriptで直接変更するプロパティ。","usage":"クリックで色を変えるなど動的にスタイルを変更したいとき。","examples":[{"code":"const el = document.getElementById('box');\nel.style.color           = 'red';\nel.style.backgroundColor = '#f5f5f5'; // ハイフンはキャメルケース\nel.style.display         = 'none';","note":"CSSのプロパティ名はキャメルケースで書く"}],"similar":[{"id":"classList","diff":"classListでクラスを追加・削除する方がスタイル管理しやすい"}],"mistakes":["CSSのbackground-colorはstyle.backgroundColorのようにキャメルケースで書く"],"browser_support":"全ブラウザ対応"},{"id":"window","word":"window","formal_name":"Window","formal_name_ja":"ウィンドウオブジェクト","category":"JavaScript","aliases":["window","window.innerWidth","window.scrollY","window.location","window.open"],"mdn_url":"https://developer.mozilla.org/ja/docs/Web/API/Window","summary":"ブラウザのウィンドウを表すグローバルオブジェクト。画面サイズ・スクロール量・URLなどを取得できる。","usage":"画面サイズを取得したいとき・現在のURLを取得・変更したいとき。","examples":[{"code":"console.log(window.innerWidth);  // 画面幅\nconsole.log(window.innerHeight); // 画面高さ\nconsole.log(window.scrollY);     // スクロール量\nconsole.log(window.location.href); // 現在のURL","note":"windowは省略可能（innerWidthと書いても同じ）"}],"similar":[{"id":"document","diff":"documentはHTMLの内容・windowはブラウザ自体"}],"mistakes":[],"browser_support":"全ブラウザ対応"}];
const LANG_COLOR={HTML:'var(--html-color)',CSS:'var(--css-color)',JavaScript:'var(--js-color)'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildTitle(t){const same=t.word.toLowerCase()===t.formal_name.toLowerCase();return same?`${esc(t.word)} <span class="ja">— ${esc(t.formal_name_ja)}</span>`:`${esc(t.word)} <span class="formal">— ${esc(t.formal_name)}</span> <span class="ja">（${esc(t.formal_name_ja)}）</span>`}
function buildCard(t){
  const lang=t.category==='HTML'?'html':t.category==='CSS'?'css':'javascript';
  const ex=t.examples[0];
  const similar=t.similar.length>0?`<div><div class="term-section-title">【関連】</div><ul class="term-related-list">${t.similar.map(s=>{const r=TERMS_DATA.find(x=>x.id===s.id);const n=r?r.word:s.id;return`<li><a href="#${s.id}">\`${esc(n)}\`</a> → ${esc(s.diff)}</li>`}).join('')}</ul></div>`:'';
  const mistakes=t.mistakes.length>0?`<div><div class="term-section-title">【注意】</div><ul class="term-mistakes-list">${t.mistakes.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:'';
  const errors=t.error_patterns&&t.error_patterns.length>0?`<div><div class="term-section-title">【エラー】</div><ul class="term-error-list">${t.error_patterns.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:'';
  const note=ex.note?`<div class="code-note">${esc(ex.note)}</div>`:'';
  const fullRow=similar||mistakes||errors?`<div class="term-full">${similar}${mistakes}${errors}</div>`:'';
  return `<div class="term-card" id="${t.id}" data-category="${t.category}"><div class="term-header"><div class="term-title">${buildTitle(t)}</div><div class="term-summary">${esc(t.summary)}</div></div><div class="term-body"><div><div class="term-section-title">【用途】</div><div class="term-usage">${esc(t.usage)}</div></div><div><div class="term-section-title">【構文】</div><div class="term-code-block"><div class="code-header"><span class="code-lang">${lang}</span><button class="copy-btn" onclick="copyCode(this)">コピー</button></div><pre>${esc(ex.code)}</pre>${note}</div></div>${fullRow}</div><div class="term-footer"><a href="${t.mdn_url}" target="_blank" rel="noopener" class="mdn-link">MDN リファレンス（日本語）→</a></div></div>`;
}
function buildSidebar(terms){
  const g={HTML:[],CSS:[],JavaScript:[]};terms.forEach(t=>g[t.category]&&g[t.category].push(t));
  return Object.entries(g).map(([l,items])=>{
    if(!items.length)return'';
    const color=LANG_COLOR[l];
    return `<div class="sidebar-group"><button class="sidebar-group-btn open" onclick="toggleGroup(this)"><span style="display:flex;align-items:center"><span class="lang-dot" style="background:${color}"></span>${l}</span><span class="arrow">▶</span></button><div class="sidebar-group-items open">${items.map(t=>`<a href="#${t.id}" class="sidebar-item" data-id="${t.id}">${t.word}</a>`).join('')}</div></div>`;
  }).join('');
}
function toggleGroup(btn){btn.classList.toggle('open');btn.nextElementSibling.classList.toggle('open')}
function buildContent(terms){
  const g={};terms.forEach(t=>{if(!g[t.category])g[t.category]=[];g[t.category].push(t);});
  return Object.entries(g).map(([l,items])=>`<div class="category-section"><div class="category-title"><span style="background:${LANG_COLOR[l]};width:9px;height:9px;border-radius:50%;display:inline-block"></span>${l}</div>${items.map(buildCard).join('')}</div>`).join('');
}
document.getElementById('sidebarContent').innerHTML=buildSidebar(TERMS_DATA);
document.getElementById('termsContent').innerHTML=buildContent(TERMS_DATA);
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  const f=q?TERMS_DATA.filter(t=>t.word.toLowerCase().includes(q)||t.formal_name.toLowerCase().includes(q)||t.formal_name_ja.includes(q)||t.summary.includes(q)||t.aliases.some(a=>a.toLowerCase().includes(q))):TERMS_DATA;
  document.getElementById('termsContent').innerHTML=f.length?buildContent(f):'';
  document.getElementById('sidebarContent').innerHTML=buildSidebar(f);
  document.getElementById('emptyState').classList.toggle('visible',!f.length);
  document.getElementById('emptyQuery').textContent=q;
  observeCards();
});
function copyCode(btn){const code=btn.closest('.term-code-block').querySelector('pre').textContent;navigator.clipboard.writeText(code).then(()=>{btn.textContent='コピー完了！';btn.classList.add('copied');setTimeout(()=>{btn.textContent='コピー';btn.classList.remove('copied');},1500);})}
let obs=null;
function observeCards(){
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.remove('active'));
        const a=document.querySelector(`.sidebar-item[data-id="${e.target.id}"]`);
        if(a){
          a.classList.add('active');
          const nav=document.querySelector('.sidebar-nav');
          if(nav){const aTop=a.offsetTop;const nh=nav.clientHeight;if(aTop<nav.scrollTop||aTop>nav.scrollTop+nh-40){nav.scrollTo({top:aTop-nh/2,behavior:'smooth'});}}
        }
      }
    });
  },{rootMargin:'-56px 0px -65% 0px',threshold:0});
  document.querySelectorAll('.term-card').forEach(el=>obs.observe(el));
}
observeCards();
if(location.hash){const id=location.hash.slice(1);setTimeout(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('highlighted');const a=document.querySelector(`.sidebar-item[data-id="${id}"]`);if(a){document.querySelectorAll('.sidebar-item').forEach(x=>x.classList.remove('active'));a.classList.add('active');}}},300);}
const btt=document.getElementById('backToTop');
window.addEventListener('scroll',()=>btt.classList.toggle('visible',window.scrollY>400),{passive:true});
btt.addEventListener('click',e=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
</script>
</body>
